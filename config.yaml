# HassBle configuration — VW ID.7 Pro (MEB) + Fiat 500e
# OBD adapters are bound in the HassBle app; no adapter MAC is hard-coded.
# Vehicle presence is detected from the car infotainment Bluetooth MAC.
# The extended CAN header comes from the Torque CSV: 17FC007B.
version: 1

defaults:
  publish:
    on_change_only: true
    min_interval: 2s
    heartbeat: 30s

vehicle_presence:
  enabled: true
  disconnect_delay_seconds: 30
  vehicles:
    - id: vw_id7
      name: "VW ID.7 Pro"
      bluetooth_mac: "10:31:2C:D7:E4:5E"
    - id: fiat_500e
      name: "Fiat 500e"
      bluetooth_mac: "8C:8B:5B:27:B7:BD"

devices:
  - id: vw_id7_pro
    name: "VW ID.7 Pro"
    source: obd
    vehicle_id: vw_id7
    obd:
      # Default HassBle ELM327 BLE characteristics are used until the adapter is bound.
      # If your adapter uses different UUIDs, set them here.
      init_commands:
        - "ATSP7"
    sensors:
      - key: hv_battery_soc_bms
        name: "HV Battery SOC (BMS)"
        mode: "22"
        pid: "028C"
        pre_commands: ["ATCP17", "ATSHFC007B"]
        formula: "a/2.5"
        update_interval: 10s
        unit: "%"
        device_class: battery
        state_class: measurement
        accuracy_decimals: 1

      - key: hv_battery_voltage
        name: "HV Battery Voltage"
        mode: "22"
        pid: "1E3B"
        pre_commands: ["ATCP17", "ATSHFC007B"]
        formula: "(a*256+b)/4"
        update_interval: 10s
        unit: "V"
        device_class: voltage
        state_class: measurement
        accuracy_decimals: 1

      - key: hv_battery_temperature
        name: "HV Battery Temperature"
        mode: "22"
        pid: "2A0B"
        pre_commands: ["ATCP17", "ATSHFC007B"]
        formula: "a/2-40"
        update_interval: 30s
        unit: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1

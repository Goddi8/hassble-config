# HassBle configuration — VW ID.7 Pro (MEB) + Fiat 500e
# OBD adapters are bound in the HassBle app; no adapter MAC is hard-coded.
# Vehicle presence is detected from the car infotainment Bluetooth MAC.
# The extended CAN header comes from the Torque CSV: 17FC007B.
version: 1

defaults:
  publish:
    on_change_only: true
    min_interval: 2s
    heartbeat: 30s

vehicle_presence:
  enabled: true
  disconnect_delay_seconds: 15
  vehicles:
    - id: vw_id7
      name: "VW ID.7 Pro"
      bluetooth_mac: "10:32:2C:D7:E4:5E"
    - id: fiat_500e
      name: "Fiat 500e"
      bluetooth_mac: "8C:8B:5B:27:B7:BD"

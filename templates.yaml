# HassBle template: VW ID.7 Pro (MEB) – HV battery values
# BLE UUIDs captured from IOS-VLINK with nRF Connect.
# MAC omitted; bind the adapter in the app.

templates:
  - id: vw_id7_pro_meb
    name: "VW ID.7 Pro (MEB) – HV battery"
    description: "HV battery SOC, voltage and temperature via IOS-VLINK BLE"
    device:
      id: vw_id7_pro
      name: "VW ID.7 Pro"
      source: obd
      obd:
        service_uuid: "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
        tx_char_uuid: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"
        rx_char_uuid: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"
        tx_delay: 50ms
        init_commands: ["ATSP7"]
      sensors:
        - key: hv_battery_soc_bms
          name: "HV Battery SOC (BMS)"
          mode: "22"
          pid: "028C"
          formula: "a/2.5"
          pre_commands: ["ATCP17", "ATSHFC007B"]
          update_interval: 10s
          unit: "%"
          device_class: battery
          state_class: measurement
          accuracy_decimals: 1

        - key: hv_battery_voltage
          name: "HV Battery Voltage"
          mode: "22"
          pid: "1E3B"
          formula: "(a*256+b)/4"
          pre_commands: ["ATCP17", "ATSHFC007B"]
          update_interval: 10s
          unit: "V"
          device_class: voltage
          state_class: measurement
          accuracy_decimals: 1

        - key: hv_battery_temperature
          name: "HV Battery Temperature"
          mode: "22"
          pid: "2A0B"
          formula: "a/2-40"
          pre_commands: ["ATCP17", "ATSHFC007B"]
          update_interval: 30s
          unit: "°C"
          device_class: temperature
          state_class: measurement
          accuracy_decimals: 1

# HassBle template for VW ID.7 Pro (MEB)
# Based on the user's Torque PID definitions.
# The ECU header 17FC007B is split into ATCP17 + ATSHFC007B for ELM327.
# Verify adapter support and each value on the vehicle before relying on it.
templates:
  - id: vw_id7_pro_meb_hv
    name: "VW ID.7 Pro (MEB) – HV-Batterie"
    description: "UDS-HV-Werte aus Torque: SOC, Batteriespannung und Batterietemperatur"
    device:
      id: vw_id7_pro_meb
      name: "VW ID.7 Pro – HV-Batterie"
      source: obd
      obd:
        # Generic BLE ELM327 defaults; adjust if your adapter uses other UUIDs.
        service_uuid: "FFF0"
        tx_char_uuid: "FFF2"
        rx_char_uuid: "FFF1"
        tx_delay: 100ms
      sensors:
        - key: hv_battery_soc
          mode: "22"
          pid: "028C"
          pre_commands: ["ATCP17", "ATSHFC007B"]
          update_interval: 10s
          formula: "a / 2.5"
          unit: "%"
          device_class: battery
          state_class: measurement
          accuracy_decimals: 1

        - key: hv_battery_voltage
          mode: "22"
          pid: "1E3B"
          pre_commands: ["ATCP17", "ATSHFC007B"]
          update_interval: 10s
          formula: "(a * 256 + b) / 4"
          unit: "V"
          device_class: voltage
          state_class: measurement
          accuracy_decimals: 1

        - key: hv_battery_temperature
          mode: "22"
          pid: "2A0B"
          pre_commands: ["ATCP17", "ATSHFC007B"]
          update_interval: 30s
          formula: "a / 2 - 40"
          unit: "°C"
          device_class: temperature
          state_class: measurement
          accuracy_decimals: 1
